name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Same clang-format major/minor as local dev, so formatting results match.
      - run: pipx install clang-format==20.1.8

      - name: Type-check
        run: npm run tsc

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm test

      # The compiled Stockfish WASM is checked into public/, so no Emscripten toolchain is needed.
      - name: Production build
        run: npx webpack --mode production
